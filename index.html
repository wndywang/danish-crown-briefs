<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tulip Jamonilla · Creator Briefs</title><meta name="robots" content="noindex,nofollow"><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#0E3A4D; --teal-deep:#06222E; --teal-mid:#14506B;
  --yellow:#FFCD00; --cream:#FFFBF0; --sand:#F4ECDC;
  --red:#E63946; --green:#47705D;
}
html{scroll-behavior:smooth}
body{
  background:var(--teal); color:var(--cream);
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
  font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:820px;margin:0 auto;padding:0 22px}
section{padding:54px 0;border-top:1px solid rgba(255,251,240,.12)}
section:first-of-type{border-top:none}

/* ---------- hero ---------- */
.top{padding:64px 0 46px;text-align:left}
.eyebrow{
  font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--yellow);font-weight:700;margin-bottom:26px
}
.hi{font-size:clamp(30px,7vw,46px);font-weight:800;line-height:1.12;margin-bottom:18px}
.hi .wave{display:inline-block;animation:wave 2.4s ease-in-out infinite;transform-origin:70% 70%}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%{transform:rotate(14deg)}20%{transform:rotate(-8deg)}30%{transform:rotate(14deg)}40%{transform:rotate(-4deg)}50%{transform:rotate(10deg)}}
.big{
  font-size:clamp(44px,12vw,92px);font-weight:900;line-height:.94;
  letter-spacing:-.02em;color:var(--yellow);margin:26px 0 20px
}
.lede{font-size:clamp(17px,2.4vw,20px);max-width:640px;color:rgba(255,251,240,.9)}
.tierpill{
  display:inline-block;background:var(--yellow);color:var(--teal);
  font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
  padding:8px 16px;border-radius:999px;margin-bottom:8px
}

/* ---------- headings ---------- */
h2{
  font-size:clamp(26px,5vw,38px);font-weight:900;line-height:1.05;
  letter-spacing:-.01em;margin-bottom:8px
}
h2 .n{color:var(--yellow);margin-right:12px}
.sub{color:rgba(255,251,240,.66);margin-bottom:26px;font-size:16px}

/* ---------- cards ---------- */
.cards{display:grid;gap:14px}
.grid2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{
  background:var(--cream);color:var(--teal);
  border-radius:16px;padding:22px 24px
}
.card h3{font-size:19px;font-weight:800;margin-bottom:4px}
.card .tl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--teal-mid);font-weight:800;margin-bottom:8px}
.card p{font-size:15px;line-height:1.5;color:#2b4a58}

/* deliverable cards */
.deliv{display:flex;gap:18px;align-items:flex-start;
  background:var(--cream);color:var(--teal);border-radius:16px;padding:24px}
.deliv .num{
  flex:none;width:52px;height:52px;border-radius:14px;background:var(--yellow);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:900;color:var(--teal)
}
.deliv h3{font-size:20px;font-weight:900;margin-bottom:4px}
.deliv p{font-size:15px;color:#2b4a58}

.total{
  background:var(--yellow);color:var(--teal);border-radius:16px;
  padding:20px 24px;font-weight:900;font-size:19px;text-align:center;margin-top:4px
}

/* hooks */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{
  border:1.5px solid rgba(255,205,0,.55);color:var(--cream);
  border-radius:999px;padding:9px 16px;font-size:14px
}
.chip b{color:var(--yellow)}

/* timeline */
.tl-row{display:flex;gap:18px;padding:16px 0;border-bottom:1px dashed rgba(255,251,240,.18)}
.tl-row:last-child{border-bottom:none}
.tl-when{flex:none;width:150px;color:var(--yellow);font-weight:800;font-size:15px}
.tl-what{font-size:16px}
.tl-row.peak .tl-what b{color:var(--yellow)}

/* rules */
.rules{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.rule{border-radius:16px;padding:22px 24px}
.rule.do{background:rgba(71,112,93,.22);border:1px solid rgba(141,183,164,.5)}
.rule.dont{background:rgba(230,57,70,.14);border:1px solid rgba(230,57,70,.45)}
.rule h3{font-size:17px;font-weight:800;margin-bottom:12px}
.rule.do h3{color:#8DB7A4}
.rule.dont h3{color:#F5A3A9}
.rule li{margin:0 0 9px 20px;font-size:15px;line-height:1.5}

/* hashtags */
.tags{background:var(--teal-deep);border:2px solid var(--yellow);border-radius:16px;padding:26px}
.tags .t{font-size:clamp(18px,3.6vw,26px);font-weight:900;color:var(--yellow);
  line-height:1.5;word-break:break-word}
.tags .must{margin-top:14px;font-size:15px;color:rgba(255,251,240,.9)}
.tags .must b{color:var(--cream)}

/* product */
.truth{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.truth div{background:rgba(255,251,240,.08);border-left:3px solid var(--yellow);
  padding:14px 16px;font-size:15px;border-radius:0 10px 10px 0}

/* close */
.close{text-align:center;padding:64px 0 78px}
.close .big{color:var(--yellow)}
.yes{
  display:inline-block;background:var(--yellow);color:var(--teal);
  font-weight:900;font-size:18px;padding:17px 40px;border-radius:999px;
  text-decoration:none;margin-top:10px
}
.sig{margin-top:26px;color:rgba(255,251,240,.6);font-size:14px;font-style:italic}
footer{padding:26px 0 40px;color:rgba(255,251,240,.4);font-size:12.5px;text-align:center}
@media(max-width:600px){
  .tl-row{flex-direction:column;gap:4px}
  .tl-when{width:auto}
  .deliv{flex-direction:column;gap:12px}
}

.pick{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:30px}
.pick a{display:block;background:var(--cream);color:var(--teal);border-radius:16px;
padding:28px;text-decoration:none}
.pick a b{display:block;font-size:22px;font-weight:900;margin-bottom:6px}
.pick a span{font-size:15px;color:#2b4a58}
</style></head><body>
<div class="wrap"><div class="top">
<div class="eyebrow">Tulip Jamonilla · Philippines · 2026</div>
<h1 class="hi">Hi there 👋<br>Welcome to the Campaign!</h1>
<div class="big">YOU MAKE<br>THE MOMENT.</div>
<p class="lede">Pick the brief that matches your tier.</p>
<div class="pick">
  <a href="hero.html"><b>Hero Creator</b><span>YouTube long-form + a Short</span></a>
  <a href="tiktok.html"><b>TikTok Creator</b><span>Macro and Micro · TikTok + a repost</span></a>
</div>
</div></div>
<footer>Tulip Jamonilla · You Make the Moment · Philippines 2026</footer>
</body></html>
