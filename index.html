<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tulip Jamonilla · Creator Briefs</title><meta name="robots" content="noindex,nofollow">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#0E3A4D; --deep:#06222E; --mid:#14506B;
  --yellow:#FFCD00; --cream:#FFFBF0; --sand:#F4ECDC;
  --red:#E63946; --green:#47705D; --mint:#8DB7A4;
}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;background:var(--teal);color:var(--cream)
}

/* ---------------- deck mechanics ---------------- */
.deck{
  display:flex;height:100dvh;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;scroll-behavior:smooth;
  scrollbar-width:none
}
.deck::-webkit-scrollbar{display:none}
.slide{
  flex:0 0 100vw;height:100dvh;scroll-snap-align:start;
  overflow-y:auto;overflow-x:hidden;
  padding:96px 30px 90px;display:flex;align-items:center;justify-content:center;
  position:relative
}
.inner{width:100%;max-width:1080px;position:relative;z-index:2}

/* colour blocks, alternating like the deck */
.s-teal{background:var(--teal);color:var(--cream)}
.s-deep{background:var(--deep);color:var(--cream)}
.s-yellow{background:var(--yellow);color:var(--teal)}
.s-cream{background:var(--cream);color:var(--teal)}
.s-sand{background:var(--sand);color:var(--teal)}
.s-red{background:var(--red);color:var(--cream)}
.s-mid{background:var(--mid);color:var(--cream)}
.s-green{background:var(--green);color:var(--cream)}

/* ---------------- nav ---------------- */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:40;
  display:flex;gap:4px;align-items:center;
  padding:12px 16px;background:rgba(6,34,46,.82);backdrop-filter:blur(10px);
  overflow-x:auto;scrollbar-width:none
}
.nav::-webkit-scrollbar{display:none}
.nav b{
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--yellow);
  margin-right:10px;white-space:nowrap;font-weight:800
}
.nav button{
  flex:none;border:0;background:transparent;color:rgba(255,251,240,.62);
  font:inherit;font-size:12px;font-weight:700;letter-spacing:.02em;
  padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;
  transition:background .2s,color .2s
}
.nav button:hover{color:var(--cream);background:rgba(255,251,240,.1)}
.nav button.on{background:var(--yellow);color:var(--teal)}
.bar{position:fixed;top:0;left:0;height:3px;background:var(--yellow);z-index:41;
  width:0;transition:width .25s ease}

.arrow{
  position:fixed;top:50%;transform:translateY(-50%);z-index:39;
  width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;
  background:rgba(6,34,46,.55);color:#fff;font-size:20px;line-height:1;
  backdrop-filter:blur(6px);transition:background .2s,transform .2s
}
.arrow:hover{background:var(--yellow);color:var(--teal);transform:translateY(-50%) scale(1.08)}
.arrow.l{left:14px} .arrow.r{right:14px}
.hint{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:39;
  font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,251,240,.55);pointer-events:none;animation:nudge 2.6s ease-in-out infinite
}
.s-yellow ~ .hint,.hint.dark{color:rgba(14,58,77,.55)}
@keyframes nudge{0%,100%{transform:translateX(-50%) translateX(0)}50%{transform:translateX(-50%) translateX(7px)}}

/* ---------------- type ---------------- */
.eyebrow{
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:800;
  opacity:.75;margin-bottom:18px
}
.s-yellow .eyebrow,.s-cream .eyebrow,.s-sand .eyebrow{color:var(--red);opacity:1}
.s-teal .eyebrow,.s-deep .eyebrow,.s-mid .eyebrow,.s-green .eyebrow{color:var(--yellow);opacity:1}
h1{font-size:clamp(30px,6.4vw,54px);font-weight:800;line-height:1.08;margin-bottom:14px}
.mega{
  font-size:clamp(46px,10.5vw,104px);font-weight:900;line-height:.9;
  letter-spacing:-.025em;margin:14px 0 22px
}
.mega .a{color:var(--yellow)} .mega .b{color:var(--red)}
.s-yellow .mega .a{color:var(--teal)} .s-yellow .mega .b{color:var(--red)}
.s-cream .mega .a,.s-sand .mega .a{color:var(--teal)}
.s-cream .mega .b,.s-sand .mega .b{color:var(--red)}
h2{font-size:clamp(30px,6vw,58px);font-weight:900;line-height:.98;letter-spacing:-.02em;margin-bottom:6px}
h2 .b{color:var(--red)} .s-teal h2 .b,.s-deep h2 .b,.s-red h2 .b{color:var(--yellow)}
.lede{font-size:clamp(16px,2.1vw,20px);line-height:1.55;max-width:680px;opacity:.92}
.sub{font-size:15px;opacity:.62;margin-bottom:24px}

/* ---------------- floating product ---------------- */
.float{
  position:absolute;z-index:1;pointer-events:none;
  filter:drop-shadow(0 30px 60px rgba(0,0,0,.45));
  animation:float 7s ease-in-out infinite
}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-26px) rotate(2deg)}}
.float.r{right:-30px;bottom:-20px;width:min(42vw,430px);border-radius:24px}
.float.can{border-radius:0;filter:drop-shadow(0 34px 54px rgba(0,0,0,.5))}
.float.dish{right:6%;bottom:-40px;width:min(30vw,300px);border-radius:20px;
  animation:float 9s ease-in-out infinite reverse;opacity:.95}
.float.tr{right:-30px;top:8%;width:min(38vw,380px);border-radius:22px}

/* Two-column layout for slides that carry product art. The art gets its own column so
   it can never sit on top of the copy - an absolutely positioned float was covering the
   fourth product truth. */
.split{display:grid;grid-template-columns:1.08fr .92fr;gap:46px;align-items:center}
.split .art{position:relative}
.split .art .can{width:100%;display:block;
  filter:drop-shadow(0 34px 54px rgba(0,0,0,.42));animation:float 7s ease-in-out infinite}
.split .art .dish{position:absolute;left:-8%;bottom:-10%;width:46%;border-radius:16px;
  box-shadow:0 22px 44px -18px rgba(0,0,0,.5);
  animation:float 9s ease-in-out infinite reverse}
/* keep copy clear of any float-positioned art on the other slides */
.textcol{max-width:min(60%,660px)}
.blob{
  position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;z-index:0;
  animation:drift 14s ease-in-out infinite alternate
}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(40px,-30px) scale(1.15)}}

/* ---------------- cards ---------------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.card{border-radius:18px;padding:22px 24px;background:rgba(255,251,240,.1);
  border:1px solid rgba(255,251,240,.2)}
.s-yellow .card,.s-cream .card,.s-sand .card{background:rgba(14,58,77,.06);border-color:rgba(14,58,77,.16)}
.card h3{font-size:19px;font-weight:900;margin-bottom:6px}
.card p{font-size:14.5px;line-height:1.5;opacity:.85}

.deliv{display:flex;gap:16px;align-items:flex-start;border-radius:18px;padding:22px;
  background:var(--cream);color:var(--teal)}
.s-cream .deliv,.s-sand .deliv{background:#fff}
.deliv .num{flex:none;width:48px;height:48px;border-radius:14px;background:var(--yellow);
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:var(--teal)}
.deliv h3{font-size:18px;font-weight:900;margin-bottom:3px}
.deliv p{font-size:14px;opacity:.85}
.total{background:var(--yellow);color:var(--teal);border-radius:16px;padding:16px;
  font-weight:900;font-size:17px;text-align:center}

/* phone-framed pillar art, like the deck's mockups */
.pill{border-radius:20px;overflow:hidden;background:rgba(255,251,240,.08);
  border:1px solid rgba(255,251,240,.18);display:flex;flex-direction:column;
  transition:transform .3s ease,box-shadow .3s ease}
.s-sand .pill,.s-cream .pill{background:#fff;border-color:rgba(14,58,77,.12)}
.pill:hover{transform:translateY(-8px);box-shadow:0 22px 44px -22px rgba(0,0,0,.55)}
.phone{position:relative;padding:10px 10px 0;background:var(--green)}
.phone img{width:100%;aspect-ratio:9/15;object-fit:cover;display:block;
  border-radius:14px 14px 0 0;border:3px solid #0d2f22;border-bottom:0}
.pill .txt{padding:16px 18px 20px}
.pill .tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;
  color:var(--red);margin-bottom:5px}
.pill h3{font-size:17px;font-weight:900;line-height:1.15;margin-bottom:6px}
.pill p{font-size:13.5px;line-height:1.45;opacity:.82}
.pill .quote{margin-top:10px;font-size:13px;font-style:italic;color:var(--red);font-weight:700}
.s-sand .pill .quote{color:var(--red)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{border:1.5px solid currentColor;border-radius:999px;padding:9px 15px;font-size:13.5px;opacity:.9}
.chip b{color:var(--yellow)} .s-cream .chip b,.s-sand .chip b,.s-yellow .chip b{color:var(--red)}

/* hashtags */
.tagbig{font-size:clamp(26px,6.2vw,62px);font-weight:900;line-height:1.16;letter-spacing:-.02em}
.tagbig div{opacity:0;animation:pop .5s ease forwards}
.tagbig div:nth-child(1){animation-delay:.15s}
.tagbig div:nth-child(2){animation-delay:.3s}
.tagbig div:nth-child(3){animation-delay:.45s}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
.flag{margin:0 0 20px;padding:15px 18px;border-radius:14px;font-size:15.5px;line-height:1.5;
  background:rgba(230,57,70,.12);border:1.5px solid var(--red)}
.flag b{color:var(--red)}
.s-teal .flag b,.s-deep .flag b,.s-mid .flag b,.s-green .flag b{color:var(--yellow)}
.must{margin-top:22px;padding:16px 18px;border-radius:14px;
  background:rgba(255,251,240,.14);font-size:15px;line-height:1.5}
.must b{font-weight:900}

/* truths */
.truths{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.split .truths{grid-template-columns:1fr 1fr}
@media(max-width:620px){.split .truths{grid-template-columns:1fr}}
.truths div{padding:14px 16px;border-radius:0 12px 12px 0;font-size:14.5px;font-weight:600;
  border-left:4px solid var(--red);background:rgba(14,58,77,.07)}
.s-teal .truths div,.s-deep .truths div{background:rgba(255,251,240,.1);border-left-color:var(--yellow)}

/* timeline */
.tl{display:grid;gap:0}
.tl .row{display:flex;gap:18px;padding:14px 0;border-bottom:1px dashed rgba(255,251,240,.22)}
.s-cream .tl .row,.s-sand .tl .row{border-bottom-color:rgba(14,58,77,.18)}
.tl .row:last-child{border-bottom:0}
.tl .w{flex:none;width:160px;font-weight:900;font-size:15px;color:var(--yellow)}
.s-cream .tl .w,.s-sand .tl .w,.s-yellow .tl .w{color:var(--red)}
.tl .t{font-size:15.5px;line-height:1.5}
.tl .row.peak{background:rgba(255,205,0,.12);border-radius:12px;padding:16px 14px;margin:6px 0}
.tl .row.peak .t b{color:var(--yellow)}
.s-cream .tl .row.peak .t b,.s-sand .tl .row.peak .t b{color:var(--red)}

/* rules */
.rules{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.rule{border-radius:18px;padding:20px 22px}
.rule.do{background:rgba(71,112,93,.2);border:1px solid var(--mint)}
.rule.dont{background:rgba(230,57,70,.13);border:1px solid rgba(230,57,70,.5)}
.rule h3{font-size:16px;font-weight:900;margin-bottom:10px}
.rule li{margin:0 0 8px 19px;font-size:14px;line-height:1.45}

/* closing */
.yes{display:inline-block;background:var(--teal);color:var(--yellow);font-weight:900;
  font-size:18px;padding:17px 44px;border-radius:999px;text-decoration:none;margin-top:12px;
  transition:transform .2s,box-shadow .2s}
.yes:hover{transform:translateY(-3px);box-shadow:0 16px 32px -14px rgba(0,0,0,.5)}
.sig{margin-top:22px;font-size:14px;font-style:italic;opacity:.72}

/* entrance animation */
.rev{opacity:0;transform:translateY(26px);transition:opacity .6s ease,transform .6s cubic-bezier(.16,1,.3,1)}
.in .rev{opacity:1;transform:none}
.in .rev:nth-child(2){transition-delay:.07s}
.in .rev:nth-child(3){transition-delay:.14s}
.in .rev:nth-child(4){transition-delay:.21s}
.in .rev:nth-child(5){transition-delay:.28s}
.in .rev:nth-child(6){transition-delay:.35s}
.wave{display:inline-block;transform-origin:70% 70%;animation:wave 2.6s ease-in-out infinite}
@keyframes wave{0%,58%,100%{transform:rotate(0)}8%{transform:rotate(15deg)}18%{transform:rotate(-9deg)}28%{transform:rotate(15deg)}38%{transform:rotate(-5deg)}48%{transform:rotate(11deg)}}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .rev{opacity:1;transform:none}
}
@media(max-width:720px){
  .slide{padding:88px 20px 76px}
  .float.r{width:54vw;right:-34px;bottom:-24px;opacity:.9}
  .float.dish{display:none}
  .split{grid-template-columns:1fr;gap:26px}
  .split .art{max-width:330px;margin:0 auto}
  .split .art .dish{display:none}
  .textcol{max-width:100%}
  .float.tr{display:none}
  .tl .row{flex-direction:column;gap:3px}.tl .w{width:auto}
  .arrow{display:none}
}

html,body{overflow:auto;height:auto}
body{background:var(--teal);display:flex;align-items:center;min-height:100dvh}
.wrap{max-width:900px;margin:0 auto;padding:60px 28px}
.pick{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:34px}
.pick a{display:block;background:var(--cream);color:var(--teal);border-radius:20px;padding:30px;
text-decoration:none;transition:transform .25s,box-shadow .25s}
.pick a:hover{transform:translateY(-6px);box-shadow:0 22px 44px -20px rgba(0,0,0,.6)}
.pick a b{display:block;font-size:23px;font-weight:900;margin-bottom:6px}
.pick a span{font-size:15px;opacity:.75}
</style></head><body><div class="wrap">
<div class="eyebrow" style="color:var(--yellow)">Tulip Jamonilla · Philippines · 2026</div>
<h1>Hi there <span class="wave">👋</span><br>Welcome to the Campaign!</h1>
<div class="mega"><span class="a">YOU MAKE</span><br>THE MOMENT.</div>
<p class="lede">Pick the brief that matches your tier.</p>
